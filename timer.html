
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Timer</title>
    <style>
        :root {
            /* Premium Dark Theme */
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --surface-hover: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #38bdf8;
            --accent-hover: #7dd3fc;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --border-radius: 1rem;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-family);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* Center vertically */
            padding: 2rem 1rem;
            -webkit-font-smoothing: antialiased;
        }

        header {
            margin-bottom: 2rem;
            text-align: center;
            width: 100%;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            color: var(--text-primary);
        }

        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1000px;
        }

        /* Timer Controls / Buttons */
        .controls-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            justify-content: center;
            max-width: 800px;
            margin-bottom: 2.5rem;
        }

        .duration-btn {
            background-color: var(--surface-color);
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 2rem;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            outline: none;
            user-select: none;
        }

        .duration-btn:hover, .duration-btn:focus-visible {
            background-color: var(--surface-hover);
            transform: translateY(-1px);
        }

        .duration-btn:focus-visible {
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.5);
        }

        .duration-btn.active {
            background-color: rgba(56, 189, 248, 0.15);
            color: var(--accent-color);
            border-color: var(--accent-color);
        }

        /* Timer Display Area */
        .timers-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 250px;
        }

        .timers-container {
            width: 100%;
            max-width: 450px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: var(--transition);
        }

        .timers-container.multi {
            max-width: 950px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }

        @media (min-width: 640px) {
            .timers-container.multi {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 900px) {
            .timers-container.multi {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        /* Empty State */
        .empty-state {
            font-size: 6rem;
            font-weight: 200;
            font-variant-numeric: tabular-nums;
            color: var(--text-secondary);
            text-align: center;
            opacity: 0.3;
            transition: var(--transition);
            width: 100%;
        }

        .empty-state.hidden {
            display: none;
        }

        /* Timer Cards */
        .timer-card {
            background-color: var(--surface-color);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--border-radius);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
        }

        .timer-card:hover {
            transform: translateY(-2px);
            background-color: var(--surface-hover);
        }
        
        .timer-card:focus-visible {
            outline: 3px solid var(--accent-color);
            outline-offset: 2px;
        }

        .timer-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .timer-label {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .timer-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            line-height: 1;
            cursor: pointer;
            padding: 0 0.5rem;
            border-radius: 0.25rem;
            transition: var(--transition);
        }

        .timer-close:hover {
            color: var(--danger-color);
            background-color: rgba(239, 68, 68, 0.1);
        }

        .timer-time {
            font-size: 4rem;
            font-weight: 300;
            font-variant-numeric: tabular-nums;
            line-height: 1.1;
            margin: 0.5rem 0;
            color: var(--text-primary);
            transition: var(--transition);
        }

        /* Single timer typography logic */
        .timers-container:not(.multi) .timer-card {
            max-width: 450px;
        }
        
        .timers-container:not(.multi) .timer-time {
            font-size: 5.5rem;
        }

        .timer-status {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 0.375rem;
            min-height: 1.25rem;
        }

        /* Status Icon SVG */
        .status-icon {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        /* States */
        .timer-card.paused {
            opacity: 0.8;
            border-style: dashed;
        }
        .timer-card.paused .timer-status {
            color: var(--warning-color);
        }
        .timer-card.paused .timer-time {
            color: var(--text-secondary);
        }

        .timer-card.completed {
            background-color: rgba(16, 185, 129, 0.1);
            border-color: var(--success-color);
            animation: pulse-green 2s infinite;
        }
        .timer-card.completed .timer-time {
            color: var(--success-color);
            font-weight: 400;
        }
        .timer-card.completed .timer-status {
            color: var(--success-color);
        }

        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* Screen Reader Only */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
        }
        
        /* Mobile Stacking Optimization */
        @media (max-width: 480px) {
            .timers-container:not(.multi) .timer-time {
                font-size: 4.5rem;
            }
            .timer-time {
                font-size: 3.5rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Focus Timer</h1>
    </header>

    <main>
        <nav class="controls-container" aria-label="Timer Durations">
            <!-- Data duration is in seconds -->
            <button class="duration-btn" data-id="60" data-duration="60">1 MIN</button>
            <button class="duration-btn" data-id="90" data-duration="90">1:30</button>
            <button class="duration-btn" data-id="120" data-duration="120">2 MIN</button>
            <button class="duration-btn" data-id="180" data-duration="180">3 MIN</button>
            <button class="duration-btn" data-id="240" data-duration="240">4 MIN</button>
            <button class="duration-btn" data-id="300" data-duration="300">5 MIN</button>
        </nav>

        <div class="timers-wrapper">
            <div id="timers-container" class="timers-container">
                <div id="empty-state" class="empty-state" aria-hidden="true">00:00</div>
                <!-- Timer cards will be injected here -->
            </div>
        </div>
    </main>

    <!-- Accessibility Announcer -->
    <div id="announcer" class="sr-only" aria-live="polite"></div>

    <script>
        /**
         * State Architecture
         * Using a Map to ensure independent state for every timer.
         */
        const timers = new Map();
        let globalLoopId = null;
        let audioCtx = null;

        // DOM Elements
        const timersContainer = document.getElementById('timers-container');
        const emptyState = document.getElementById('empty-state');
        const announcer = document.getElementById('announcer');
        const durationButtons = document.querySelectorAll('.duration-btn');

        // SVG Icons for Status
        const ICONS = {
            play: `<svg class="status-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`,
            pause: `<svg class="status-icon" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`,
            check: `<svg class="status-icon" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>`
        };

        // Initialize Event Listeners
        durationButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const id = btn.getAttribute('data-id');
                const duration = parseInt(btn.getAttribute('data-duration'), 10);
                const label = btn.textContent;
                
                handleTimerInteraction(id, duration, label, btn);
            });
        });

        /**
         * Core Timer Logic Functions
         */

        function handleTimerInteraction(id, duration, label, btn) {
            const timer = timers.get(id);

            // If timer doesn't exist or is already completed, start/restart it
            if (!timer || timer.isCompleted) {
                startTimer(id, duration, label, btn);
            } 
            // If running, pause it
            else if (timer.isRunning) {
                pauseTimer(id);
            } 
            // If paused, resume it
            else if (timer.isPaused) {
                resumeTimer(id);
            }
        }

        function startTimer(id, duration, label, btnElement) {
            // Initialize Audio Context on first interaction
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const state = {
                id,
                duration,
                remaining: duration,
                targetTimestamp: Date.now() + (duration * 1000),
                isRunning: true,
                isPaused: false,
                isCompleted: false,
                pausedRemaining: 0,
                label,
                btnElement
            };

            timers.set(id, state);
            
            // Visual Updates
            btnElement.classList.add('active');
            btnElement.setAttribute('aria-pressed', 'true');
            
            ensureCardExists(state);
            updateLayout();
            renderTimer(id);
            startGlobalLoop();
        }

        function pauseTimer(id) {
            const timer = timers.get(id);
            if (!timer) return;

            timer.isRunning = false;
            timer.isPaused = true;
            // Freeze remaining time exactly
            timer.pausedRemaining = timer.targetTimestamp - Date.now();
            
            renderTimer(id);
            updateDocumentTitle();
        }

        function resumeTimer(id) {
            const timer = timers.get(id);
            if (!timer) return;

            timer.isRunning = true;
            timer.isPaused = false;
            // Shift target timestamp forward by the duration it was paused
            timer.targetTimestamp = Date.now() + timer.pausedRemaining;
            
            renderTimer(id);
            updateDocumentTitle();
            startGlobalLoop();
        }

        function finishTimer(id) {
            const timer = timers.get(id);
            if (!timer) return;

            timer.isRunning = false;
            timer.isCompleted = true;
            timer.remaining = 0;
            
            renderTimer(id);
            playAlarm();
            
            // Accessibility Announcement
            announcer.textContent = `${timer.label} timer completed.`;
            
            updateDocumentTitle();
        }

        function removeTimer(id) {
            const timer = timers.get(id);
            if (!timer) return;

            // Remove active styling from button
            if (timer.btnElement) {
                timer.btnElement.classList.remove('active');
                timer.btnElement.setAttribute('aria-pressed', 'false');
            }

            // Remove DOM element
            const card = document.getElementById(`timer-card-${id}`);
            if (card) {
                card.remove();
            }

            timers.delete(id);
            updateLayout();
            updateDocumentTitle();

            if (timers.size === 0) {
                stopGlobalLoop();
            }
        }

        /**
         * Central Update Loop
         */
        function startGlobalLoop() {
            if (!globalLoopId) {
                globalLoopId = setInterval(updateAllTimers, 200);
            }
        }

        function stopGlobalLoop() {
            if (globalLoopId) {
                clearInterval(globalLoopId);
                globalLoopId = null;
            }
        }

        function updateAllTimers() {
            const now = Date.now();
            let anyRunning = false;

            for (const [id, timer] of timers.entries()) {
                if (timer.isRunning) {
                    anyRunning = true;
                    const remainingMs = timer.targetTimestamp - now;
                    
                    if (remainingMs <= 0) {
                        finishTimer(id);
                    } else {
                        // Update remaining seconds based on accurate timestamp diff
                        timer.remaining = Math.ceil(remainingMs / 1000);
                        renderTimer(id);
                    }
                }
            }

            if (anyRunning) {
                updateDocumentTitle();
            } else {
                stopGlobalLoop(); // Save CPU if nothing is running
            }
        }

        /**
         * UI Rendering & Formatting
         */
        
        function formatTime(seconds) {
            if (seconds <= 0) return "00:00";
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function ensureCardExists(timer) {
            let card = document.getElementById(`timer-card-${timer.id}`);
            if (!card) {
                card = document.createElement('div');
                card.id = `timer-card-${timer.id}`;
                card.className = 'timer-card';
                card.setAttribute('tabindex', '0');
                card.setAttribute('role', 'button');
                card.setAttribute('aria-label', `${timer.label} timer. Click to pause or resume.`);
                
                card.innerHTML = `
                    <div class="timer-header">
                        <span class="timer-label">${timer.label}</span>
                        <button class="timer-close" aria-label="Close ${timer.label} timer" title="Dismiss">×</button>
                    </div>
                    <div class="timer-time" aria-hidden="true"></div>
                    <div class="timer-status"></div>
                `;

                // Events
                card.addEventListener('click', () => {
                    handleTimerInteraction(timer.id, timer.duration, timer.label, timer.btnElement);
                });

                card.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        handleTimerInteraction(timer.id, timer.duration, timer.label, timer.btnElement);
                    }
                });

                card.querySelector('.timer-close').addEventListener('click', (e) => {
                    e.stopPropagation(); // Prevent card click
                    removeTimer(timer.id);
                });

                timersContainer.appendChild(card);
            }
        }

        function renderTimer(id) {
            const timer = timers.get(id);
            const card = document.getElementById(`timer-card-${id}`);
            if (!timer || !card) return;

            const timeEl = card.querySelector('.timer-time');
            const statusEl = card.querySelector('.timer-status');

            // Set time text
            timeEl.textContent = formatTime(timer.remaining);

            // Reset classes
            card.className = 'timer-card';

            // Apply specific state class & status text
            if (timer.isCompleted) {
                card.classList.add('completed');
                statusEl.innerHTML = `${ICONS.check} Done`;
            } else if (timer.isPaused) {
                card.classList.add('paused');
                statusEl.innerHTML = `${ICONS.pause} Paused`;
            } else if (timer.isRunning) {
                card.classList.add('running');
                statusEl.innerHTML = `${ICONS.play} Running`;
            }
        }

        function updateLayout() {
            if (timers.size === 0) {
                emptyState.classList.remove('hidden');
                timersContainer.classList.remove('multi');
            } else {
                emptyState.classList.add('hidden');
                // Use multi-column grid layout if more than 1 timer
                if (timers.size > 1) {
                    timersContainer.classList.add('multi');
                } else {
                    timersContainer.classList.remove('multi');
                }
            }
        }

        function updateDocumentTitle() {
            const activeTimers = Array.from(timers.values());
            const runningCount = activeTimers.filter(t => t.isRunning).length;
            const uncompletedTimers = activeTimers.filter(t => !t.isCompleted);

            if (activeTimers.length === 0) {
                document.title = "Focus Timer";
                return;
            }

            if (uncompletedTimers.length === 0) {
                document.title = "Done - Focus Timer";
                return;
            }

            if (uncompletedTimers.length === 1 && uncompletedTimers[0].isRunning) {
                // If only 1 timer is active and running, show its time
                document.title = `${formatTime(uncompletedTimers[0].remaining)} - Focus Timer`;
            } else if (runningCount > 0) {
                // If multiple are running, show count
                document.title = `${runningCount} Running - Focus Timer`;
            } else {
                // Things are paused
                document.title = "Paused - Focus Timer";
            }
        }

        /**
         * Web Audio API implementation for pleasant dual-tone alarm
         */
        function playAlarm() {
            if (!audioCtx) return; // Prevent errors if context failed
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            // Dual tone harmony
            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc1.type = 'sine';
            osc2.type = 'triangle';
            
            // Pleasant chime frequencies (C6 and E6)
            osc1.frequency.setValueAtTime(1046.50, audioCtx.currentTime); // C6
            osc2.frequency.setValueAtTime(1318.51, audioCtx.currentTime); // E6
            
            // Envelope (Fade in and out)
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.05); // Attack
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8); // Decay
            
            osc1.connect(gainNode);
            osc2.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc1.start(audioCtx.currentTime);
            osc2.start(audioCtx.currentTime);
            
            osc1.stop(audioCtx.currentTime + 0.8);
            osc2.stop(audioCtx.currentTime + 0.8);
        }
    </script>
</body>
</html>
